<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TITAN V2.7 HTTP FALLBACK</title><style>body{background:#0a0a0f;color:#fff;font-family:Arial;padding:10px}.header{background:linear-gradient(90deg,#ff0040,#ff8000);padding:12px;border-radius:10px;text-align:center}.log{font-size:10px;color:#0f0;background:#000;padding:6px;height:140px;overflow:auto;margin-top:8px}.btn{width:100%;padding:12px;border:none;border-radius:6px;font-weight:bold;margin-top:6px}.last{font-size:50px;color:#ff8000;font-weight:bold}</style></head><body>
<div class="header"><h2>TITAN V2.7 HTTP+WS</h2><div id="status">READY</div></div>
<div style="background:#1a1a2e;padding:10px;margin:8px 0;border-radius:8px">Bal: <b id="bal">$0.00</b> <span id="email" style="font-size:10px"></span></div>
<div style="background:#1a1a2e;border:2px solid #ff8000;padding:15px;border-radius:12px;text-align:center">LAST: <span id="last" class="last">-</span><div id="price"></div></div>
<div id="digits" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0"></div>
<select id="market" style="width:100%;padding:10px;background:#000;color:#fff"><option value="R_100">Vol 100</option><option value="R_50">Vol 50</option><option value="R_25">Vol 25</option></select>
<input id="tokenInput" style="width:100%;padding:10px;margin-top:8px;background:#000;color:#0f0;border:1px solid #0f0" placeholder="pat_ token">
<button class="btn" style="background:#ff0040;color:#fff" onclick="location.href='https://oauth.deriv.com/oauth2/authorize?app_id=34xnDtEmqLPic3a8oz5zu&l=en&redirect_uri=https://titan-digits.vercel.app/callback.html'">OAUTH LOGIN</button>
<button class="btn" style="background:#00ff88;color:#000" onclick="manualLogin()">LOGIN TOKEN</button>
<div id="log" class="log"></div>
<script>
const URLS=['wss://gateway.deriv.com/websockets/v3?app_id=1089','wss://ws.derivws.com/websockets/v3?app_id=1089','wss://ws.binaryws.com/websockets/v3?app_id=1089'];
const HTTP_URL='https://ws.binaryws.com/websockets/v3?app_id=1089';
let counts=Array(10).fill(0),total=0,token=localStorage.getItem('deriv_token')||'',idx=0,ws,fail=0,useHTTP=false,timer=null;
document.getElementById('tokenInput').value=token;
function log(m){let el=document.getElementById('log');el.innerHTML='> '+new Date().toLocaleTimeString()+' '+m+'<br>'+el.innerHTML;}
function init(){let h='';for(let i=0;i<10;i++)h+=`<div style="background:#1a1a2e;padding:10px;border-radius:8px;text-align:center"><b>${i}</b><div id="p${i}">0% (0)</div></div>`;document.getElementById('digits').innerHTML=h;}init();
function upd(last,price){document.getElementById('last').innerText=last;document.getElementById('price').innerText=price;counts[last]++;total++;for(let i=0;i<10;i++){let pct=total?((counts[i]/total)*100).toFixed(0):0;document.getElementById('p'+i).innerText=pct+'% ('+counts[i]+')';}}
function startHTTP(){
if(useHTTP) return; useHTTP=true; document.getElementById('status').innerHTML='● <span style="color:#00ff88">HTTP MODE ✅ (WS Blocked)</span>'; log('SWITCHED TO HTTP POLLING - WILL WORK!');
timer=setInterval(async()=>{
try{
let r=await fetch(HTTP_URL,{method:'POST',body:JSON.stringify({ticks:document.getElementById('market').value})});
let d=await r.json(); if(d.tick){let p=d.tick.quote.toString();upd(parseInt(p.slice(-1)),p);}
if(token){let ra=await fetch(HTTP_URL,{method:'POST',body:JSON.stringify({authorize:token})});let da=await ra.json(); if(da.authorize){document.getElementById('bal').innerText='$'+da.authorize.balance;}}
}catch(e){log('HTTP err '+e.message);}
},1000);
}
function connect(){
if(useHTTP) return;
let url=URLS[idx]; log('Trying WS '+ (idx+1)+'/3 '+url.split('/')[2]); document.getElementById('status').innerText='CONNECTING Server '+(idx+1)+'/3';
try{
ws=new WebSocket(url);
ws.onopen=()=>{log('WS OPENED ✅ Server '+(idx+1)); document.getElementById('status').innerHTML='CONNECTED ✅ WS Server '+(idx+1); fail=0; ws.send(JSON.stringify({ticks:document.getElementById('market').value})); if(token) ws.send(JSON.stringify({authorize:token}));};
ws.onmessage=(e)=>{let d=JSON.parse(e.data); if(d.tick){let p=d.tick.quote.toString(); upd(parseInt(p.slice(-1)),p);} if(d.authorize){document.getElementById('bal').innerText='$'+d.authorize.balance; document.getElementById('email').innerText=d.authorize.email; log('AUTH OK $'+d.authorize.balance);}};
ws.onerror=()=>{log('WS Error '+(idx+1)); ws.close();};
ws.onclose=()=>{fail++; log('Closed fail='+fail); idx=(idx+1)%URLS.length; if(fail>=6){log('ALL WS BLOCKED -> HTTP'); startHTTP();} else setTimeout(connect,800);};
}catch(e){fail++; if(fail>=6) startHTTP(); else setTimeout(connect,800);}
}
function manualLogin(){let t=document.getElementById('tokenInput').value.trim(); localStorage.setItem('deriv_token',t); token=t; log('Token saved '+t.slice(0,8));}
connect();
</script></body></html>
