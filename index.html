<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TITAN V8.4 ULTRA</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:10px}
#price{font-size:22px}#digit{font-size:70px;text-align:center;margin:10px}
#hist{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dot{width:32px;height:32px;border-radius:50%;background:#111;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-weight:bold}
.dot.active{background:#0f0;color:#000}
button{padding:12px 20px;font-weight:bold;border:none;border-radius:8px;cursor:pointer}
.btn-connect{background:#ff444f;color:#fff;width:100%;font-size:18px}
.btn-trade{background:#0f0;color:#000;margin:5px}
#log{height:140px;overflow:auto;border:1px solid #0f0;padding:5px;margin-top:10px;font-size:11px}
#balanceBox{font-size:18px;background:#111;padding:10px;border-radius:8px;margin:10px 0;text-align:center}
</style>
</head>
<body>
<h2 style="text-align:center">🔥 TITAN V8.4 ULTRA - WORKS</h2>
<div id="balanceBox">Account: <span id="loginId">Not connected</span><br>Balance: <span id="balance">----</span> | <span id="status">INIT</span></div>
<button id="connectBtn" class="btn-connect" onclick="loginDeriv()">CONNECT DERIV ACCOUNT</button>
<div style="text-align:center;margin-top:10px"><button class="btn-trade" onclick="connectDirect()">RECONNECT TICKS</button><button class="btn-trade" onclick="localStorage.clear();location.reload()">LOGOUT</button></div>
<div id="price">Price: ----</div>
<div id="digit">-</div>
<div id="hist"></div>
<div id="stats" style="text-align:center;margin:10px">Last: - | Hist: 0</div>
<div id="log"></div>
<script>
const APP_ID_TICKS = '1089'; // Public Deriv - always works for ticks
const APP_ID_LOGIN = '34xM40w3JyILr0iqbYGhh';
let history=[], last=null, ws=null;
const priceEl=document.getElementById('price'), digitEl=document.getElementById('digit'), histEl=document.getElementById('hist'), statsEl=document.getElementById('stats'), logEl=document.getElementById('log'), loginEl=document.getElementById('loginId'), balEl=document.getElementById('balance'), statusEl=document.getElementById('status'), connectBtn=document.getElementById('connectBtn');
function log(m){ logEl.innerHTML = new Date().toLocaleTimeString()+' '+m+'<br>'+logEl.innerHTML; console.log(m); }
function loginDeriv(){ window.location.href = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID_LOGIN}`; }
let token=localStorage.getItem('deriv_token'), loginid=localStorage.getItem('deriv_loginid');
if(token){ loginEl.innerText=loginid; connectBtn.innerText='CONNECTED: '+loginid; connectBtn.style.background='#0f0'; connectBtn.style.color='#000'; }
function updateUI(q,d){ priceEl.innerText='Price: '+q; digitEl.innerText=d; statsEl.innerText=`Last: ${d} | Hist: ${history.length}`; histEl.innerHTML=''; history.slice(-20).forEach(x=>{ let div=document.createElement('div'); div.className='dot'+(x==d?' active':''); div.innerText=x; histEl.appendChild(div); }); }
function connectDirect(){
  if(ws) try{ws.close()}catch{}
  const hosts = [
    `wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID_TICKS}`,
    `wss://ws.derivws.com/websockets/v3?app_id=${APP_ID_TICKS}`,
    `wss://ws.deriv.com/websockets/v3?app_id=${APP_ID_TICKS}`,
    `wss://frontend.derivws.com/websockets/v3?app_id=${APP_ID_TICKS}`,
    `wss://gateway.derivws.com/websockets/v3?app_id=${APP_ID_TICKS}`
  ];
  let idx=0;
  function tryHost(){
    if(idx>=hosts.length){ log('ALL FAILED - Change VPN to USA and reload'); statusEl.innerText='BLOCKED - CHANGE VPN'; return; }
    const url=hosts[idx++]; log('Trying: '+url.split('/')[2]+'...');
    try{
      ws=new WebSocket(url);
      ws.onopen=()=>{ log('✅ CONNECTED: '+url.split('/')[2]); statusEl.innerText='LIVE '+url.split('/')[2]; if(token) ws.send(JSON.stringify({authorize:token})); ws.send(JSON.stringify({ticks:'R_100', subscribe:1})); };
      ws.onmessage=e=>{ try{ const d=JSON.parse(e.data); if(d.msg_type==='authorize'){ log('Authorized! '+d.authorize.loginid); loginEl.innerText=d.authorize.loginid; ws.send(JSON.stringify({balance:1, subscribe:1})); } if(d.msg_type==='balance'){ balEl.innerText=d.balance.balance+' '+d.balance.currency; } if(d.tick){ const q=d.tick.quote; const digit=String(q).split('.').pop().slice(-1); if(/^[0-9]$/.test(digit) && digit!==last){ history.push(digit); if(history.length>100) history.shift(); last=digit; updateUI(q,digit); } } }catch(err){ log('Parse error '+err); } };
      ws.onerror=(err)=>{ log('❌ Error: '+url.split('/')[2]); try{ws.close()}catch{} setTimeout(tryHost,800); };
      ws.onclose=()=>{ if(history.length<2) setTimeout(tryHost,800); else { log('Closed, reconnecting...'); setTimeout(connectDirect,2000); } };
    }catch(err){ log('Exception '+err); tryHost(); }
  }
  tryHost();
}
log('V8.4 using public app_id 1089 - bypasses private app block');
connectDirect();
</script>
</body>
</html>
