<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TITAN DIGITS</title>
<style>body{background:#0a0a0a;color:#0f0;font-family:monospace;padding:10px}input,button{width:100%;padding:12px;margin:6px 0;background:#111;color:#0f0;border:1px solid #0f0;border-radius:6px}button{background:#0f0;color:#000;font-weight:bold}#log{height:200px;overflow:auto;border:1px solid #333;padding:8px;white-space:pre-wrap;font-size:12px}#last{font-size:48px;text-align:center;margin:10px 0}#digits{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.d{border:1px solid #333;padding:8px;text-align:center}</style>
</head><body>
<h2>⚡ TITAN DIGITS — DIRECT WS</h2>
<input id="token" placeholder="Deriv API Token (pat_...)" type="password">
<button onclick="saveToken()">SAVE TOKEN & START</button>
<div id="last">-</div>
<div id="digits"></div>
<div id="log">> Ready...</div>
<script>
let ws, token=localStorage.getItem('deriv_token')||'', ticks=[], lastDigit='-';
const logEl=document.getElementById('log'), lastEl=document.getElementById('last'), digitsEl=document.getElementById('digits');
function log(m){ logEl.textContent += '\n'+m; logEl.scrollTop=logEl.scrollHeight; console.log(m); }
function saveToken(){ token=document.getElementById('token').value.trim(); if(!token){log('> Enter token!');return;} localStorage.setItem('deriv_token',token); log('> TOKEN SAVED'); connect(); }
if(token){ document.getElementById('token').value=token; }

const ENDPOINTS=[
  'wss://ws.binaryws.com/websockets/v3?app_id=1089',
  'wss://ws.derivws.com/websockets/v3?app_id=1089',
  'wss://ws.deriv.com/websockets/v3?app_id=1089'
];
let ep=0;
function connect(){
  const url=ENDPOINTS[ep%ENDPOINTS.length];
  log('> TRY '+url);
  try{
    if(ws) try{ws.close()}catch{}
    ws=new WebSocket(url);
    ws.onopen=()=>{ log('> CONNECTED '+url); ep=0; if(token) ws.send(JSON.stringify({authorize:token})); else ws.send(JSON.stringify({ticks:'R_100'})); };
    ws.onmessage=(e)=>{
      try{
        const data=JSON.parse(e.data);
        if(data.error){ log('> ERR '+data.error.message); return; }
        if(data.authorize){ log('> AUTHORIZED '+data.authorize.logininfo.email); ws.send(JSON.stringify({ticks:'R_100'})); return; }
        if(data.tick){
          const q=data.tick.quote.toString(); const d=parseInt(q.slice(-1)); lastDigit=d;
          lastEl.textContent=d; lastEl.style.color=d%2==0?'#0f0':'#ff0';
          ticks.push(d); if(ticks.length>100) ticks.shift();
          log('> TICK '+q+' LAST:'+d); updateDigits();
        }
      }catch(err){ log('> Parse err '+err); }
    };
    ws.onerror=()=>{ log('> ERR '+url+' -> next'); ep++; setTimeout(connect,1000); };
    ws.onclose=()=>{ log('> CLOSED -> retry'); ep++; setTimeout(connect,1500); };
  }catch(e){ log('> EX '+e.message); ep++; setTimeout(connect,1000); }
}
function updateDigits(){
  const cnt=Array(10).fill(0); ticks.forEach(x=>cnt[x]++);
  const total=ticks.length||1;
  digitsEl.innerHTML=cnt.map((c,i)=>`<div class="d" style="background:${i==lastDigit?'#0f0':'#111'};color:${i==lastDigit?'#000':'#0f0'}"><b>${i}</b><br>${c}<br>${(c/total*100).toFixed(1)}%</div>`).join('');
}
for(let i=0;i<10;i++) digitsEl.innerHTML+=`<div class="d">${i}<br>0<br>0%</div>`;
connect();
</script>
</body></html>
