<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITAN V7 - NO VPN</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:10px}
#price{font-size:28px;font-weight:bold}
#digit{font-size:60px;text-align:center;margin:10px}
#hist{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center}
button{padding:10px 20px;background:#0f0;color:#000;border:none;font-weight:bold;margin-top:10px}
#log{height:100px;overflow:auto;border:1px solid #0f0;padding:5px;margin-top:10px;font-size:12px}
</style>
</head>
<body>
<h2>🔥 TITAN V7 - SERVER PROXY (NO VPN)</h2>
<div id="price">Price: ----</div>
<div id="digit">-</div>
<div id="hist"></div>
<div id="stats">Last: - | Hist: 0 | Status: INIT</div>
<button onclick="connect()">CONNECT V7</button>
<div id="log"></div>

<script>
let lastDigit=null;
let history=[];
let priceEl=document.getElementById('price');
let digitEl=document.getElementById('digit');
let histEl=document.getElementById('hist');
let statsEl=document.getElementById('stats');
let logEl=document.getElementById('log');

function log(m){
  logEl.innerHTML = new Date().toLocaleTimeString() + ' ' + m + '<br>' + logEl.innerHTML;
}

function updateUI(q,d){
  priceEl.innerText='Price: '+q;
  digitEl.innerText=d;
  statsEl.innerText='Last: '+d+' | Hist: '+history.length+' | Status: TICK OK VIA SERVER';
  histEl.innerHTML='';
  history.slice(-20).forEach(x=>{
    let div=document.createElement('div');
    div.className='dot';
    div.innerText=x;
    if(x==d) div.style.background='#0f0';
    histEl.appendChild(div);
  });
}

function connect(){
  log('V7 CONNECTING VIA /api/tick (NO VPN NEEDED)');
  const es = new EventSource('/api/tick');
  
  es.onopen = ()=>{ log('SERVER CONNECTED'); };
  
  es.onmessage = e=>{
    try{
      const m=JSON.parse(e.data);
      if(m.tick){
        const q=parseFloat(m.tick.quote);
        const digit=String(m.tick.quote).slice(-1);
        if(digit!==lastDigit){
          history.push(digit);
          if(history.length>50) history.shift();
          lastDigit=digit;
          updateUI(q,digit);
        }
      }
    }catch(err){}
  };
  
  es.onerror = ()=>{
    log('SERVER RECONNECTING...');
    es.close();
    setTimeout(connect, 2000);
  };
}

// Auto connect
connect();
</script>
</body>
</html>
