<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TITAN V8.8 PROXY - CHOICE 2</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:10px}
#digit{font-size:70px;text-align:center;margin:10px}
#hist{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dot{width:32px;height:32px;border-radius:50%;background:#111;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-weight:bold}
.dot.active{background:#0f0;color:#000}
.row{display:flex;gap:8px}.row input{flex:1;padding:14px;background:#111;color:#0f0;border:1px solid #0f0;border-radius:8px}
.eyeBtn{width:55px;background:#111;border:1px solid #0f0;border-radius:8px;color:#0f0;font-size:20px}
button{padding:14px;width:100%;margin:6px 0;border-radius:8px;font-weight:bold;border:none}
.btn{background:#0f0;color:#000}.btn2{background:#333;color:#fff}
#log{height:200px;overflow:auto;border:1px solid #0f0;padding:5px;font-size:11px;background:#050505}
#balBox{text-align:center;background:#111;padding:10px;border-radius:8px;margin-bottom:10px}
.small{font-size:10px;color:#888;text-align:center}
</style>
</head><body>
<h2 style="text-align:center">🔥 TITAN V8.8 PROXY (Choice 2)</h2>
<div id="balBox">
Account: <span id="lid">Not connected</span><br>
Bal: <span id="bal">----</span> | <span id="st">INIT</span><br>
<small>Mode: PHONE -> RENDER -> DERIV (shows real error)</small>
</div>
<div class="row"><input id="pat" type="password" placeholder="Paste Deriv PAT"><button class="eyeBtn" onclick="document.getElementById('pat').type=document.getElementById('pat').type=='password'?'text':'password'">👁️</button></div>
<div class="small">Token hidden •••• stored locally only</div>
<button class="btn" onclick="connectProxy()">CONNECT VIA RENDER PROXY</button>
<button class="btn2" onclick="localStorage.clear();location.reload()">LOGOUT / CLEAR</button>
<div id="price" style="font-size:20px;text-align:center;margin:10px">Price: ----</div>
<div id="digit">-</div>
<div id="hist"></div>
<div id="stats" style="text-align:center;margin:8px">Last: - | Hist: 0</div>
<div id="log"></div>
<script>
let h=[],last=null,ws=null;
const logEl=document.getElementById('log');
function log(m){logEl.innerHTML=new Date().toLocaleTimeString()+' '+m+'<br>'+logEl.innerHTML; console.log(m);}
let saved=localStorage.getItem('deriv_pat'); if(saved){document.getElementById('pat').value=saved; log('🔒 Saved PAT ****'+saved.slice(-4));}
function ui(q,d){document.getElementById('price').innerText='Price: '+q;document.getElementById('digit').innerText=d;document.getElementById('stats').innerText=`Last: ${d} | Hist: ${h.length}`; const he=document.getElementById('hist'); he.innerHTML=''; h.slice(-20).forEach(x=>{let div=document.createElement('div');div.className='dot'+(x==d?' active':'');div.innerText=x;he.appendChild(div)});}
function connectProxy(){
 let pat=document.getElementById('pat').value.trim(); if(!pat){alert('Paste PAT first');return}
 localStorage.setItem('deriv_pat',pat);
 log('🔒 Using Render proxy /proxy with PAT ****'+pat.slice(-4));
 const proto = location.protocol==='https:'?'wss:':'ws:';
 const proxyUrl = proto+'//'+location.host+'/proxy';
 log('Connecting to: '+proxyUrl);
 try{
  ws=new WebSocket(proxyUrl);
  ws.onopen=()=>{log('✅ Connected to Render proxy');document.getElementById('st').innerText='RENDER LIVE';ws.send(JSON.stringify({authorize:pat}));};
  ws.onmessage=e=>{
   try{
    const d=JSON.parse(e.data);
    if(d.msg_type==='log'){log('📡 '+d.msg);return;}
    if(d.error){log('❌ REAL DERIV ERROR: '+d.error.message+' | Code:'+d.error.code);return;}
    if(d.msg_type==='authorize'){log('✅ Authorized '+d.authorize.loginid);document.getElementById('lid').innerText=d.authorize.loginid; ws.send(JSON.stringify({balance:1,subscribe:1})); ws.send(JSON.stringify({ticks:'R_100',subscribe:1}));}
    if(d.msg_type==='balance'){document.getElementById('bal').innerText=d.balance.balance+' '+d.balance.currency;}
    if(d.tick){const q=d.tick.quote;const dig=String(q).split('.').pop().slice(-1);if(/^[0-9]$/.test(dig)&&dig!==last){h.push(dig);if(h.length>100)h.shift();last=dig;ui(q,dig);}}
   }catch(err){log('Parse err '+err);}
  };
  ws.onerror=()=>{log('❌ Proxy WS error');};
  ws.onclose=ev=>{log(`⚠️ Proxy closed Code=${ev.code} Reason=${ev.reason||'none'}`);};
 }catch(err){log('Exception '+err);}
}
if(saved) log('V8.8 PROXY ready - Click CONNECT to see REAL Deriv error'); else log('V8.8 PROXY ready - Paste PAT then CONNECT');
</script></body></html>
