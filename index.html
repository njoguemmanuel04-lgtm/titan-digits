<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>TITAN DIGITS - LIVE</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:10px}.top{display:flex;gap:8px}.bal{flex:1;background:linear-gradient(90deg,#FFD700,#FFA500);color:#000;border-radius:12px;padding:12px;font-weight:900}.sign{background:#00ff66;color:#000;border:0;border-radius:12px;padding:12px 18px;font-weight:900}.auto{margin-top:10px;background:#00ff66;color:#000;padding:14px;border-radius:20px;text-align:center;font-weight:900;width:100%;border:0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.digit{background:#111;border:2px solid #333;border-radius:14px;padding:10px;text-align:center}.digit.hot{background:#00ff66;color:#000;border-color:#00ff66}</style></head><body><div class="top"><div class="bal" id="bal">Bal: $0.00 | TITAN READY</div><button class="sign" onclick="login()">SIGN UP</button></div><button class="auto" id="ab" onclick="toggleAuto()">⏸️ AUTO OFF</button><div style="margin-top:10px;background:#111;border:1px solid #333;border-radius:12px;padding:10px;font-size:12px" id="info">WS: OFF - Tap SIGN UP to LOGIN</div><div class="grid" id="grid"></div><div style="margin-top:10px;background:#111;border-radius:12px;padding:10px;font-family:monospace;font-size:12px" id="log">🚀 TITAN DIGITS V1 Ready...</div><script>const APP_ID="34qyJGBERhw2zjIw8hKtD";const REDIRECT="https://titan-digits.vercel.app/callback.html";let token=localStorage.getItem("deriv_token")||"",ws,balance=0,last100=[],digits={};function login(){location.href=`https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&brand=deriv&redirect_uri=${REDIRECT}`;}function toggleAuto(){let b=document.getElementById("ab");b.innerText=b.innerText.includes("OFF")?"▶️ AUTO ON | TITAN ACTIVE":"⏸️ AUTO OFF";}function render(){let g=document.getElementById("grid");g.innerHTML="";for(let i=0;i<10;i++){let c=digits[i]||{count:0},pct=last100.length?Math.round(c.count/last100.length*100):0;let hot=Object.values(digits).sort((a,b)=>b.count-a.count)[0];let isHot=hot&&c.count==hot.count&&c.count>0;g.innerHTML+=`<div class="digit ${isHot?"hot":""}"><b style="font-size:22px">${i}</b><br>${pct}%<br>${c.count}M</div>`;}}function connect(){if(!token){render();return;}ws=new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);ws.onopen=()=>ws.send(JSON.stringify({authorize:token}));ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.authorize){balance=d.authorize.balance;document.getElementById("bal").innerText=`Bal: $${parseFloat(balance).toFixed(2)} | TITAN LIVE ✅`;ws.send(JSON.stringify({ticks:"R_100",subscribe:1}));}if(d.tick){let last=d.tick.quote.toFixed(2).slice(-1);last100.unshift(parseInt(last));if(last100.length>100)last100.pop();if(!digits[last])digits[last]={count:0};digits[last].count++;document.getElementById("info").innerHTML=`R_100: ${d.tick.quote} | Last:${last} | WS: <b style="color:#00ff66">LIVE ✅</b>`;render();}};ws.onclose=()=>setTimeout(connect,2000);}if(token)document.querySelector(".sign").innerText="✅ LOGGED IN";connect();render();</script></body></html>
