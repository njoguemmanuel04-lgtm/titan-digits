<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>TITAN V5 DIRECT</title><style>body{background:#0a0a0a;color:#0f0;font-family:monospace;padding:10px}button{padding:12px;background:#0f0;border:0;font-weight:bold;width:100%;margin:5px 0}#log{height:300px;overflow:auto;background:#111;padding:8px;border:1px solid #333;font-size:12px}</style></head><body>
<h3>TITAN V5 DIRECT - WARP ONLY</h3>
<input id="token" placeholder="paste Deriv token" style="width:100%;padding:10px"><button onclick="save()">SAVE TOKEN</button>
<div>Price: <span id="price">-</span> | Last: <span id="last">-</span> | Hist: <span id="hist">0</span> | <span id="status">CONNECTING...</span></div>
<button onclick="toggle()">START/STOP</button>
<div id="log"></div>
<script>
let ws=null,token=localStorage.getItem('deriv_token')||'',history=[],active=false,lastDigit=-1,endpointIndex=0;
const ENDPOINTS=['wss://ws.derivws.com/websockets/v3?app_id=1089','wss://ws.binaryws.com/websockets/v3?app_id=1089','wss://ws.deriv.com/websockets/v3?app_id=1089'];
const $=id=>document.getElementById(id);
if(token)$('token').value=token;
function log(m){const d=$('log');d.innerHTML+='<div>> '+m+'</div>';d.scrollTop=d.scrollHeight;console.log(m);}
function connect(){
 const url=ENDPOINTS[endpointIndex%ENDPOINTS.length];
 log('TRYING '+url+' ...');$('status').textContent='TRYING...';
 ws=new WebSocket(url);
 ws.onopen=()=>{log('REAL CONNECTED '+url);$('status').textContent='REAL CONNECTED';ws.send(JSON.stringify({ticks:'R_100'}));if(token)ws.send(JSON.stringify({authorize:token}));};
 ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.tick){const q=parseFloat(m.tick.quote);const digit=Math.floor(q*100)%10;if(digit!==lastDigit){history.push(digit);if(history.length>20)history.shift();$('hist').textContent=history.length;$('last').textContent=digit;$('price').textContent=q.toFixed(2);lastDigit=digit;log('TICK '+q.toFixed(2)+' LAST:'+digit+' via REAL');if(active&&history.length>=11)checkSignal(digit,q);}}if(m.authorize){log('AUTH OK balance:'+m.authorize.balance);}if(m.buy){log('TRADE RESULT: '+JSON.stringify(m.buy).slice(0,120));}if(m.error){log('ERROR: '+JSON.stringify(m.error));}}catch(err){}};
 ws.onerror=()=>{log('WS ERROR '+url);};
 ws.onclose=()=>{log('WS CLOSED, retry...');$('status').textContent='RETRYING';endpointIndex++;setTimeout(connect,2000);};
}
function checkSignal(d,q){
 // Simple diff logic: most frequent digit in last 11
 const freq={};history.forEach(x=>freq[x]=(freq[x]||0)+1);let maxD=0,maxC=-1;for(let k in freq){if(freq[k]>maxC){maxC=freq[k];maxD=parseInt(k);}}
 if(maxC>=6){const stake=1;log('BUYING DIFF '+maxD+' $'+stake);ws.send(JSON.stringify({buy:1,price:stake,parameters:{amount:stake,basis:'stake',contract_type:'DIGITDIFF',symbol:'R_100',duration:1,duration_unit:'t',barrier:maxD.toString()}}));}
}
function save(){token=$('token').value.trim();localStorage.setItem('deriv_token',token);log('TOKEN SAVED');if(ws&&ws.readyState===1)ws.send(JSON.stringify({authorize:token}));}
function toggle(){active=!active;log(active?'TRADING ACTIVE':'STOPPED');}
connect();
</script></body></html>
