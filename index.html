<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TITAN V2.1</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:Arial;padding:10px}.header{background:linear-gradient(90deg,#ff0040,#ff8000);padding:15px;border-radius:12px;text-align:center;margin-bottom:10px}.balance{background:#1a1a2e;padding:12px;border-radius:10px;display:flex;justify-content:space-between;margin-bottom:10px;border:1px solid #ff0040}.digits{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}.digit-box{background:#1a1a2e;border:1px solid #333;padding:12px;border-radius:10px;text-align:center}.digit-box.hot{background:#00ff88;color:#000;transform:scale(1.1)}.last-digit{background:#1a1a2e;border:2px solid #ff8000;padding:20px;border-radius:15px;text-align:center;margin-bottom:10px}.last-digit span{font-size:60px;color:#ff8000;font-weight:bold}.controls{background:#1a1a2e;padding:15px;border-radius:12px}.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:bold;margin-top:8px}.btn-login{background:linear-gradient(90deg,#ff0040,#ff8000);color:#fff}.status{text-align:center;font-size:12px;color:#888}</style>
</head>
<body>
<div class="header"><h1>🔥 TITAN DIGITS V2.1 🔥</h1><div class="status">● <span id="status">READY</span></div></div>
<div class="balance"><div>Bal: <b id="bal">$0.00</b></div><div>Profit: <b id="profit" style="color:#00ff88">$0.00</b></div></div>
<div class="last-digit"><div style="font-size:12px;color:#888">LAST DIGIT</div><span id="last">-</span><div id="price" style="font-size:10px;color:#555"></div></div>
<div class="digits" id="digits"></div>
<div class="controls">
<select id="market" style="width:100%;padding:10px;border-radius:6px;background:#000;color:#fff;border:1px solid #333"><option value="R_100">Volatility 100 Index</option><option value="R_50">Vol 50</option><option value="R_25">Vol 25</option><option value="1HZ100V">Vol 100 (1s)</option></select>
<input id="tokenInput" placeholder="Paste Deriv API Token here (optional)" style="width:100%;padding:12px;margin-top:10px;border-radius:6px;background:#000;color:#00ff88;border:1px solid #00ff88">
<button class="btn btn-login" onclick="login()">🔐 CONNECT DERIV ACCOUNT</button>
<button class="btn" style="background:#00ff88;color:#000" onclick="manualLogin()">🔑 LOGIN WITH TOKEN</button>
<div style="font-size:10px;color:#888;margin-top:10px;text-align:center">Get token: app.deriv.com → Account Settings → API Token → Create (Read + Trade)</div>
<div id="log" style="margin-top:10px;font-size:11px;color:#666;height:50px;overflow:auto;background:#000;padding:8px;border-radius:6px"></div>
</div>
<script>
const APP_ID='34xnDtEmqLPic3a8oz5zu'; const REDIRECT='https://titan-digits.vercel.app/callback.html';
let ws, counts=Array(10).fill(0), total=0, token=localStorage.getItem('deriv_token')||'';
document.getElementById('tokenInput').value=token;
function log(m){document.getElementById('log').innerHTML='<div>> '+new Date().toLocaleTimeString()+' - '+m+'</div>'+document.getElementById('log').innerHTML}
function init(){let h='';for(let i=0;i<10;i++)h+=`<div class="digit-box" id="d${i}"><div style="font-size:22px;font-weight:bold">${i}</div><div id="p${i}" style="font-size:11px">0% (0)</div></div>`;document.getElementById('digits').innerHTML=h;}
init();
function update(last){counts[last]++;total++;for(let i=0;i<10;i++){let pct=total?((counts[i]/total)*100).toFixed(1):0;document.getElementById('p'+i).innerText=pct+'% ('+counts[i]+')';document.getElementById('d'+i).className='digit-box'+(counts[i]==Math.max(...counts)?' hot':'');}}
function connect(){ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id='+APP_ID);ws.onopen=()=>{document.getElementById('status').innerText='CONNECTED';log('Connected');let m=document.getElementById('market').value;ws.send(JSON.stringify({ticks:m}));if(token)ws.send(JSON.stringify({authorize:token}));};ws.onmessage=(e)=>{let d=JSON.parse(e.data);if(d.msg_type=='tick'){let price=d.tick.quote.toString();let last=parseInt(price.slice(-1));document.getElementById('last').innerText=last;document.getElementById('price').innerText=price;update(last);}if(d.msg_type=='authorize'){document.getElementById('bal').innerText='$'+d.authorize.balance;document.getElementById('status').innerText='CONNECTED: '+d.authorize.email;log('Balance: $'+d.authorize.balance);}};ws.onclose=()=>setTimeout(connect,2000);}connect();
function login(){window.location.href='https://oauth.deriv.com/oauth2/authorize?app_id='+APP_ID+'&redirect_uri='+REDIRECT;}
function manualLogin(){let t=document.getElementById('tokenInput').value.trim();if(!t){alert('Paste token first!');return;}localStorage.setItem('deriv_token',t);token=t;log('Token saved, authorizing...');if(ws)ws.send(JSON.stringify({authorize:token}));}
document.getElementById('market').onchange=()=>{if(ws){ws.send(JSON.stringify({forget_all:'ticks'}));ws.send(JSON.stringify({ticks:document.getElementById('market').value}));counts=Array(10).fill(0);total=0;init();}};
if(token)log('Token found');
</script>
</body>
</html>
