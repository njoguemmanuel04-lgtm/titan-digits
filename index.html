<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TITAN V2.9 PROXY</title><style>body{background:#0a0a0f;color:#fff;font-family:Arial;padding:10px}.h{background:linear-gradient(90deg,#00ff88,#00ccff);padding:12px;border-radius:10px;text-align:center}.l{font-size:55px;color:#00ff88;font-weight:bold}.b{width:100%;padding:12px;border:none;border-radius:6px;font-weight:bold;margin-top:6px}.lg{font-size:10px;color:#0f0;background:#000;padding:6px;height:150px;overflow:auto}</style></head><body>
<div class="h"><h2>TITAN V2.9 PROXY FIX</h2><div id="s">READY</div></div>
<div style="background:#1a1a2e;padding:10px;margin:8px 0;border-radius:8px">Bal: <b id="bal">$0.00</b></div>
<div style="background:#1a1a2e;border:2px solid #00ff88;padding:15px;border-radius:12px;text-align:center">LAST: <span id="last" class="l">-</span><div id="pr" style="color:#888"></div><div id="md" style="font-size:10px;color:#0f0"></div></div>
<div id="dg" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0"></div>
<select id="mk" style="width:100%;padding:10px;background:#000;color:#fff"><option value="R_100">Vol 100</option><option value="R_50">Vol 50</option><option value="R_25">Vol 25</option></select>
<input id="tk" style="width:100%;padding:10px;margin-top:8px;background:#000;color:#0f0;border:1px solid #0f0" placeholder="pat_ token">
<button class="b" style="background:#00ff88;color:#000" onclick="localStorage.setItem('deriv_token',document.getElementById('tk').value);location.reload()">SAVE TOKEN</button>
<div id="lg" class="lg"></div>
<script>
let c=Array(10).fill(0),t=0,tk=localStorage.getItem('deriv_token')||'',lp='';
document.getElementById('tk').value=tk;
let d='';for(let k=0;k<10;k++)d+=`<div style="background:#1a1a2e;padding:10px;border-radius:8px;text-align:center"><b>${k}</b><div id="p${k}">0%</div></div>`;document.getElementById('dg').innerHTML=d;
function L(m){document.getElementById('lg').innerHTML='> '+m+'<br>'+document.getElementById('lg').innerHTML}
function U(last,price){if(price==lp) return; lp=price; document.getElementById('last').innerText=last; document.getElementById('pr').innerText=price; c[last]++; t++; for(let k=0;k<10;k++){let p=t?((c[k]/t)*100).toFixed(0):0; document.getElementById('p'+k).innerText=p+'% ('+c[k]+')';}}
async function H(){try{let r=await fetch('/api/tick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticks:document.getElementById('mk').value})}); let j=await r.json(); if(j.tick){let p=j.tick.quote+''; U(parseInt(p.slice(-1)),p); document.getElementById('md').innerText='PROXY HTTP ✅ LIVE'; document.getElementById('s').innerHTML='● PROXY MODE ✅ ACTIVE'; L('TICK '+p+' LAST='+p.slice(-1));} if(tk){let ra=await fetch('/api/tick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({authorize:tk})}); let ja=await ra.json(); if(ja.authorize){document.getElementById('bal').innerText='$'+ja.authorize.balance.toFixed(2); L('BAL OK $'+ja.authorize.balance);}}}catch(e){L('ERR '+e.message)}}
L('Starting PROXY mode...'); document.getElementById('s').innerHTML='● PROXY MODE ✅ ACTIVE'; setInterval(H,1000); H();
</script></body></html>
