<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TITAN V8.7</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:10px;
  background:#000;
  color:#00ff00;
  font-family:monospace;
}

h2{
  text-align:center;
  margin:18px 0 22px;
  color:#00ff00;
}

#balanceBox{
  background:#111;
  border-radius:12px;
  padding:14px;
  text-align:center;
  font-size:17px;
  line-height:1.6;
  margin-bottom:20px;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

#patInput{
  flex:1;
  min-width:0;
  padding:15px;
  background:#111;
  color:#00ff00;
  border:2px solid #00ff00;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

.eyeBtn{
  width:60px;
  height:54px;
  background:#111;
  color:#fff;
  border:2px solid #00ff00;
  border-radius:10px;
  font-size:22px;
}

button{
  width:100%;
  border:none;
  border-radius:10px;
  padding:16px;
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
}

.btn{
  background:#00ff00;
  color:#000;
}

.btn2{
  background:#333;
  color:#fff;
}

.small{
  color:#777;
  text-align:center;
  font-size:11px;
  margin:10px 0;
}

#price{
  margin-top:20px;
  font-size:24px;
}

#digit{
  font-size:72px;
  text-align:center;
  margin:12px 0;
  min-height:80px;
}

#hist{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:10px;
}

.dot{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#111;
  border:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.dot.active{
  background:#00ff00;
  color:#000;
}

#stats{
  text-align:center;
  margin:14px;
  font-size:15px;
}

#log{
  height:180px;
  overflow:auto;
  border:1px solid #00ff00;
  padding:8px;
  margin-top:15px;
  font-size:12px;
  line-height:1.5;
  background:#000;
}

.connected{
  color:#00ff00;
}

.error{
  color:#ff3333;
}

</style>
</head>

<body>

<h2>🔥 TITAN V8.7</h2>

<div id="balanceBox">

  Account:
  <span id="loginId">
    Not connected
  </span>

  <br>

  Balance:
  <span id="balance">
    ----
  </span>

  |

  <span id="status">
    INIT
  </span>

</div>


<div class="row">

  <input
    id="patInput"
    type="password"
    placeholder="Paste Deriv API Token here"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
  >

  <button
    class="eyeBtn"
    id="eyeButton"
    onclick="toggleEye()">
    👁️
  </button>

</div>


<div class="small">
  Token hidden as •••• |
  Long-press input to PASTE |
  Stored locally only
</div>


<button
  class="btn"
  onclick="connectWithPAT()">
  CONNECT WITH PAT
</button>


<button
  class="btn2"
  onclick="logout()">
  LOGOUT / CLEAR TOKEN
</button>


<div id="price">
  Price: ----
</div>


<div id="digit">
  -
</div>


<div id="hist"></div>


<div id="stats">
  Last: - | Hist: 0
</div>


<div id="log"></div>


<script>

/* =========================================================
   TITAN V8.7
   PHONE → RENDER → DERIV
   ========================================================= */

const APP_ID = '1089';

let history = [];
let last = null;
let ws = null;
let reconnectTimer = null;
let manuallyDisconnected = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const patInput =
  document.getElementById('patInput');

const priceEl =
  document.getElementById('price');

const digitEl =
  document.getElementById('digit');

const histEl =
  document.getElementById('hist');

const statsEl =
  document.getElementById('stats');

const logEl =
  document.getElementById('log');

const loginEl =
  document.getElementById('loginId');

const balEl =
  document.getElementById('balance');

const statusEl =
  document.getElementById('status');

const eyeButton =
  document.getElementById('eyeButton');


/* =========================================================
   LOG
   ========================================================= */

function log(message){

  const time =
    new Date().toLocaleTimeString();

  logEl.innerHTML =
    time +
    ' ' +
    message +
    '<br>' +
    logEl.innerHTML;

}


/* =========================================================
   EYE BUTTON
   ========================================================= */

function toggleEye(){

  if(patInput.type === 'password'){

    patInput.type = 'text';

    eyeButton.innerText = '🙈';

  }else{

    patInput.type = 'password';

    eyeButton.innerText = '👁️';

  }

}


/* =========================================================
   LOCAL TOKEN
   ========================================================= */

const savedToken =
  localStorage.getItem('deriv_pat');

if(savedToken){

  patInput.value = savedToken;

  log(
    '🔒 Saved PAT ****' +
    savedToken.slice(-4)
  );

}else{

  log(
    'TITAN V8.7 ready'
  );

}


/* =========================================================
   UPDATE PRICE / DIGIT
   ========================================================= */

function updateUI(price, digit){

  priceEl.innerText =
    'Price: ' + price;

  digitEl.innerText =
    digit;

  statsEl.innerText =
    'Last: ' +
    digit +
    ' | Hist: ' +
    history.length;

  histEl.innerHTML = '';

  history
    .slice(-20)
    .forEach(function(x){

      const div =
        document.createElement('div');

      div.className =
        'dot' +
        (x === digit
          ? ' active'
          : '');

      div.innerText = x;

      histEl.appendChild(div);

    });

}


/* =========================================================
   LOGOUT
   ========================================================= */

function logout(){

  manuallyDisconnected = true;

  if(reconnectTimer){

    clearTimeout(reconnectTimer);

    reconnectTimer = null;

  }

  if(ws){

    try{
      ws.close();
    }catch(e){}

    ws = null;

  }

  localStorage.removeItem('deriv_pat');

  patInput.value = '';

  loginEl.innerText =
    'Not connected';

  balEl.innerText =
    '----';

  statusEl.innerText =
    'LOGGED OUT';

  priceEl.innerText =
    'Price: ----';

  digitEl.innerText =
    '-';

  history = [];

  last = null;

  histEl.innerHTML = '';

  statsEl.innerText =
    'Last: - | Hist: 0';

  log(
    '🔓 Logged out and token cleared'
  );

}


/* =========================================================
   CONNECT WITH PAT
   ========================================================= */

function connectWithPAT(){

  manuallyDisconnected = false;

  const pat =
    patInput.value.trim();

  if(!pat){

    alert(
      'Long-press the input and PASTE your Deriv API token.'
    );

    return;

  }


  /* Save token locally */

  localStorage.setItem(
    'deriv_pat',
    pat
  );


  /* Close old connection */

  if(ws){

    try{
      ws.close();
    }catch(e){}

    ws = null;

  }


  log(
    '🔒 PAT ****' +
    pat.slice(-4) +
    ' connecting...'
  );


  statusEl.innerText =
    'CONNECTING';


  /*
    IMPORTANT:

    The browser does NOT connect directly
    to ws.derivws.com.

    It connects to our Render server.

    Render then connects to Deriv.
  */

  const protocol =
    location.protocol === 'https:'
      ? 'wss:'
      : 'ws:';


  const proxyURL =
    protocol +
    '//' +
    location.host +
    '/deriv';


  log(
    '🌐 Connecting Titan → Render'
  );


  try{

    ws =
      new WebSocket(proxyURL);


    /* =====================================================
       WEBSOCKET OPEN
       ===================================================== */

    ws.onopen = function(){

      log(
        '✅ Connected to Titan Render server'
      );

      statusEl.innerText =
        'DERIV CONNECTING';


      /*
        Send PAT through the encrypted
        WebSocket connection.
      */

      ws.send(
        JSON.stringify({
          authorize: pat
        })
      );

    };


    /* =====================================================
       WEBSOCKET MESSAGE
       ===================================================== */

    ws.onmessage =
      function(event){

        let data;

        try{

          data =
            JSON.parse(event.data);

        }catch(error){

          log(
            '⚠️ Invalid server message'
          );

          return;

        }


        /* ================================================
           RENDER PROXY MESSAGE
           ================================================ */

        if(data.type === 'proxy'){

          log(
            '🌐 ' +
            data.message
          );


          if(
            data.status ===
            'connected'
          ){

            statusEl.innerText =
              'DERIV CONNECTED';

          }


          if(
            data.status ===
            'connecting'
          ){

            statusEl.innerText =
              'CONNECTING';

          }


          if(
            data.status ===
            'error'
          ){

            statusEl.innerText =
              'DERIV ERROR';

          }


          if(
            data.status ===
            'closed'
          ){

            statusEl.innerText =
              'DISCONNECTED';

          }


          return;

        }


        /* ================================================
           DERIV ERROR
           ================================================ */

        if(data.error){

          log(
            '❌ ' +
            data.error.message
          );

          statusEl.innerText =
            'ERROR';

          return;

        }


        /* ================================================
           AUTHORIZATION
           ================================================ */

        if(
          data.msg_type ===
          'authorize'
        ){

          if(data.authorize){

            log(
              '✅ ACCOUNT: ' +
              data.authorize.loginid
            );


            loginEl.innerText =
              data.authorize.loginid;


            statusEl.innerText =
              'LIVE';


            /*
              Request balance
            */

            ws.send(
              JSON.stringify({
                balance: 1,
                subscribe: 1
              })
            );


            /*
              Subscribe to R_100 ticks
            */

            ws.send(
              JSON.stringify({
                ticks: 'R_100',
                subscribe: 1
              })
            );


            log(
              '📡 R_100 tick stream requested'
            );

          }

        }


        /* ================================================
           BALANCE
           ================================================ */

        if(
          data.msg_type ===
          'balance'
        ){

          if(data.balance){

            balEl.innerText =
              data.balance.balance +
              ' ' +
              data.balance.currency;

          }

        }


        /* ================================================
           TICK
           ================================================ */

        if(data.tick){

          const quote =
            data.tick.quote;


          /*
            Convert price to string
          */

          const quoteString =
            String(quote);


          /*
            Get final digit
          */

          const parts =
            quoteString.split('.');


          let digit;


          if(parts.length > 1){

            digit =
              parts[parts.length - 1]
              .slice(-1);

          }else{

            digit =
              quoteString.slice(-1);

          }


          /*
            Only accept 0-9
          */

          if(
            /^[0-9]$/.test(digit)
          ){

            /*
              Avoid duplicate consecutive
              display values.
            */

            if(digit !== last){

              history.push(digit);


              if(
                history.length > 100
              ){

                history.shift();

              }


              last =
                digit;


              updateUI(
                quote,
                digit
              );

            }

          }

        }

      };


    /* =====================================================
       WEBSOCKET ERROR
       ===================================================== */

    ws.onerror =
      function(){

        log(
          '❌ Titan Render WebSocket error'
        );

        statusEl.innerText =
          'ERROR';

      };


    /* =====================================================
       WEBSOCKET CLOSE
       ===================================================== */

    ws.onclose =
      function(){

        log(
          '🔌 Titan Render connection closed'
        );

        if(
          !manuallyDisconnected
        ){

          statusEl.innerText =
            'DISCONNECTED';

          /*
            Give the connection a little time
            before retrying.
          */

          if(!reconnectTimer){

            reconnectTimer =
              setTimeout(
                function(){

                  reconnectTimer =
                    null;

                  const token =
                    localStorage
                      .getItem(
                        'deriv_pat'
                      );

                  if(token){

                    log(
                      '🔄 Reconnecting...'
                    );

                    connectWithPAT();

                  }

                },
                5000
              );

          }

        }

      };


  }catch(error){

    log(
      '❌ Connection error: ' +
      error.message
    );

    statusEl.innerText =
      'ERROR';

  }

}


/* =========================================================
   AUTO CONNECT
   ========================================================= */

if(savedToken){

  /*
    Small delay gives the page time to load
    before opening the Render WebSocket.
  */

  setTimeout(
    function(){

      connectWithPAT();

    },
    800
  );

}

</script>

</body>
</html>
