<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>TITAN DIGITS - FINAL FIX</title><style>body{background:#0a0e13;color:#fff;font-family:monospace;text-align:center;margin:0;padding:10px}h1{font-size:16px;margin:10px 0}#big{font-size:90px;font-weight:bold;color:#00ff88;line-height:1;margin:10px 0}#status{color:#00ff88;margin:10px 0;font-size:14px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px auto;max-width:400px}.box{background:#1a2332;padding:8px;border-radius:8px;border:1px solid #223}.box b{font-size:18px;display:block}.box span{font-size:11px;opacity:0.7;display:block}.box.predict{border:2px solid #00ff88;box-shadow:0 0 10px #00ff88}#info{margin:10px 0;font-size:14px;font-weight:bold}input{width:90%;max-width:400px;padding:12px;background:#111a27;border:1px solid #334;color:#0f0;border-radius:8px;margin:5px 0;text-align:center}button{width:92%;max-width:400px;padding:12px;background:#00ff88;color:#000;border:none;border-radius:8px;font-weight:bold;font-size:14px;margin:5px 0;cursor:pointer}#log{background:#000;color:#0f0;text-align:left;padding:10px;height:200px;overflow-y:auto;font-size:11px;border-radius:8px;max-width:400px;margin:10px auto;white-space:pre-wrap}.small{font-size:11px;color:#888;margin:5px}</style></head><body><h1>TITAN DIGITS - SAFARICOM FIX (HTTPS)</h1><div id="big">-</div><div id="status">Connecting via HTTPS...</div><div class="grid" id="grid"></div><div id="info">History:0 | PREDICT:- | CONF:0%</div><input id="tokenInput" type="password" placeholder="Token saved ✓ hidden ••••"><br><button onclick="let i=document.getElementById('tokenInput'); i.type=i.type==='password'?'text':'password'" style="background:#1a2332;color:#0f0;border:1px solid #334;padding:6px;font-size:12px;width:auto">👁️ Show / Hide</button><br><input id="stakeInput" type="number" value="1"><button onclick="saveAndStart()">SAVE TOKEN & START TRADING</button><div class="small">Token stored only in YOUR phone + hidden. Delete old leaked token!</div><div id="log">> TITAN HTTPS MODE READY
> Polling via Vercel USA...</div><script>let history=[],API_TOKEN=localStorage.getItem('deriv_token')||'',lastDigit=null,isTrading=false;if(API_TOKEN)document.getElementById('tokenInput').placeholder='Token saved ✓ hidden ••••';function log(m){let l=document.getElementById('log');l.innerText+='\n> '+m;l.scrollTop=l.scrollHeight;}function render(){if(history.length===0){document.getElementById('grid').innerHTML='';document.getElementById('info').innerText='History:0 | PREDICT:- | CONF:0%';return;}let counts=Array(10).fill(0);history.forEach(d=>{if(d>=0&&d<=9)counts[d]++;});let total=history.length;let minIdx=0,minVal=Math.min(...counts);for(let i=0;i<10;i++){if(counts[i]===minVal){minIdx=i;break;}}let conf=Math.round(((total-minVal)/total)*100);if(conf<20)conf=20;if(conf>85)conf=85;let html='';for(let i=0;i<10;i++){let pct=Math.round((counts[i]/total)*100);let cls=i===minIdx&&total>=5?'box predict':'box';html+=`<div class="${cls}"><b>${i}</b><span>count:${counts[i]}</span><span>${pct}%</span></div>`;}document.getElementById('grid').innerHTML=html;document.getElementById('info').innerText=`History:${total} | PREDICT:${total>=5?minIdx:'-'} | CONF:${total>=5?conf:0}%`;}async function fetchTick(){try{const res=await fetch('/api/tick?t='+Date.now(),{cache:'no-store'});const data=await res.json();if(data.quote){let qStr=data.quote.toString();lastDigit=parseInt(qStr.slice(-1));if(isNaN(lastDigit))return;document.getElementById('big').innerText=lastDigit;document.getElementById('status').innerText=`TICK ${data.quote} LAST:${lastDigit} via HTTPS`;history.push(lastDigit);if(history.length>20)history.shift();render();log(`TICK ${data.quote} LAST:${lastDigit}`);if(isTrading&&history.length>=6){let counts=Array(10).fill(0);history.forEach(d=>counts[d]++);let minIdx=0;let minV=Math.min(...counts);for(let i=0;i<10;i++)if(counts[i]===minV){minIdx=i;break;}if(!window.lastTrade||Date.now()-window.lastTrade>8000){window.lastTrade=Date.now();tradeDigit(minIdx);}}}catch(e){}}async function tradeDigit(predict){let stake=document.getElementById('stakeInput').value||1;log(`BUY DIGIT ${predict} via HTTPS...`);try{const res=await fetch('/api/trade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:API_TOKEN,buy_params:{buy:1,price:parseFloat(stake),parameters:{amount:parseFloat(stake),basis:"stake",contract_type:"DIGITUNDER",currency:"USD",duration:1,duration_unit:"t",symbol:"R_100",barrier:predict}}})});const data=await res.json();log(`TRADE RESULT: ${JSON.stringify(data).slice(0,250)}`);if(data.buy)log(`BOUGHT! ID:${data.buy.contract_id} PREDICT:${predict}`);}catch(e){log('TRADE HTTPS ERR:'+e.message);}}function saveAndStart(){let t=document.getElementById('tokenInput').value.trim();if(t){API_TOKEN=t;localStorage.setItem('deriv_token',t);document.getElementById('tokenInput').value='';document.getElementById('tokenInput').placeholder='Token saved ✓ hidden ••••';log('Token saved hidden ✓');}if(!API_TOKEN){log('ERROR: Paste Deriv token first!');return;}isTrading=true;log('TRADING ARMED via HTTPS! Stake:$'+(document.getElementById('stakeInput').value||1));}setInterval(fetchTick,1100);fetchTick();render();</script></body></html>
