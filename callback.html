<!DOCTYPE html><html><body style="background:#000;color:#0f0;display:flex;align-items:center;justify-content:center;height:100vh;font-family:monospace"><h2>✅ TITAN LOGIN SUCCESS...</h2><script>const p=new URLSearchParams(location.search);let t="";for(let v of p.values()){if(v.includes("-")){t=v;break;}}if(!t)for(let k of p.keys()){if(k.startsWith("acct")){t=p.get(k);break;}}if(t){localStorage.setItem("deriv_token",t);setTimeout(()=>location.href="/",500);}else location.href="/";</script></body></html>
